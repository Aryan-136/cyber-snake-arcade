<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberSnake 2077 // Fullscreen Arcade by Aryan Pandya</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #020617;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 100vh;
      padding: 12px;
    }

    /* Top Arcade Header */
    .arcade-hud {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f5d4;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 8px;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.25);
    }
    .hud-title {
      font-size: 15px;
      font-weight: 900;
      color: #00f5d4;
      text-shadow: 0 0 8px rgba(0, 245, 212, 0.7);
      letter-spacing: 1px;
    }
    .hud-metrics {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .metric-label {
      font-size: 9px;
      color: #94a3b8;
    }
    .metric-val {
      font-size: 14px;
      font-weight: bold;
      color: #ff0080;
      text-shadow: 0 0 6px rgba(255, 0, 128, 0.6);
    }

    .hud-buttons {
      display: flex;
      gap: 8px;
    }
    .hud-btn {
      background: #1e293b;
      border: 1px solid #00f5d4;
      color: #00f5d4;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: #00f5d4;
      color: #020617;
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.6);
    }

    /* Canvas Stage */
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #030712;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 245, 212, 0.15);
    }

    /* Touch Controls Overlay for Mobile */
    #touch-dpad {
      display: none;
      width: 100%;
      max-width: 260px;
      margin-top: 8px;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
    }
    @media (max-width: 768px) {
      #touch-dpad {
        display: grid;
      }
      .hud-title {
        font-size: 12px;
      }
    }
    .dpad-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #00f5d4;
      color: #00f5d4;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(0, 245, 212, 0.2);
    }
    .dpad-btn:active {
      background: #00f5d4;
      color: #020617;
    }

    /* Fullscreen Mode Styling */
    :fullscreen #game-wrapper, :-webkit-full-screen #game-wrapper {
      max-width: 100vw;
      max-height: 100vh;
      padding: 0;
      border-radius: 0;
    }
    :fullscreen #game-canvas, :-webkit-full-screen #game-canvas {
      max-height: 85vh;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <header class="arcade-hud">
      <div class="hud-title">🕹️ CYBERSNAKE 2077</div>
      <div class="hud-metrics">
        <div class="metric">
          <span class="metric-label">SCORE</span>
          <span class="metric-val" id="score">00000</span>
        </div>
        <div class="metric">
          <span class="metric-label">HIGH</span>
          <span class="metric-val" id="high-score" style="color: #ffd166;">00000</span>
        </div>
        <div class="metric">
          <span class="metric-label">LENGTH</span>
          <span class="metric-val" id="length-val" style="color: #00f5d4;">03</span>
        </div>
      </div>
      <div class="hud-buttons">
        <button class="hud-btn" id="fs-btn">⛶ FULLSCREEN</button>
      </div>
    </header>

    <div id="canvas-container">
      <canvas id="game-canvas" width="800" height="500"></canvas>
    </div>

    <!-- On-Screen Touch Controls for Mobile -->
    <div id="touch-dpad">
      <div></div>
      <button class="dpad-btn" id="dpad-up">▲</button>
      <div></div>
      <button class="dpad-btn" id="dpad-left">◀</button>
      <button class="dpad-btn" id="dpad-down">▼</button>
      <button class="dpad-btn" id="dpad-right">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const lengthEl = document.getElementById('length-val');
    const fsBtn = document.getElementById('fs-btn');

    // Fullscreen Toggle
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => {});
        fsBtn.innerText = '🗗 EXIT FS';
      } else {
        document.exitFullscreen().catch(e => {});
        fsBtn.innerText = '⛶ FULLSCREEN';
      }
    });

    const COLS = 40;
    const ROWS = 25;
    const TILE_SIZE = canvas.width / COLS; // 20px

    let snake = [{x: 10, y: 12}, {x: 9, y: 12}, {x: 8, y: 12}];
    let dir = {x: 1, y: 0};
    let inputQueue = [];
    let foods = [];
    let particles = [];
    let score = 0;
    let highScore = localStorage.getItem('cybersnake_high') || 0;
    highScoreEl.innerText = String(highScore).padStart(5, '0');
    let speed = 90;
    let lastTime = 0;
    let accumulator = 0;
    let gameState = 'START'; // 'START', 'PLAYING', 'OVER'

    // Web Audio FX Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'bonus') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.08);
          osc.frequency.setValueAtTime(784, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.24);
        } else if (type === 'over') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    function spawnFood() {
      foods = [];
      // Always spawn 2 food items on board for fast continuous captures!
      for (let i = 0; i < 2; i++) {
        let valid = false, fx, fy;
        while (!valid) {
          fx = Math.floor(Math.random() * COLS);
          fy = Math.floor(Math.random() * ROWS);
          valid = !snake.some(s => s.x === fx && s.y === fy) && !foods.some(f => f.x === fx && f.y === fy);
        }
        foods.push({
          x: fx,
          y: fy,
          type: Math.random() < 0.3 ? 'golden' : 'cyan',
          pulse: 0
        });
      }
    }

    function addExplosion(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
          x: x * TILE_SIZE + TILE_SIZE/2,
          y: y * TILE_SIZE + TILE_SIZE/2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function step() {
      if (gameState !== 'PLAYING') return;

      if (inputQueue.length > 0) {
        dir = inputQueue.shift();
      }

      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // Toroidal grid wrapping
      if (head.x < 0) head.x = COLS - 1;
      if (head.x >= COLS) head.x = 0;
      if (head.y < 0) head.y = ROWS - 1;
      if (head.y >= ROWS) head.y = 0;

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameState = 'OVER';
        sound('over');
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('cybersnake_high', highScore);
          highScoreEl.innerText = String(highScore).padStart(5, '0');
        }
        return;
      }

      snake.unshift(head);

      // Check food captures
      let eatenIdx = foods.findIndex(f => f.x === head.x && f.y === head.y);
      if (eatenIdx !== -1) {
        const f = foods[eatenIdx];
        const pts = f.type === 'golden' ? 50 : 15;
        score += pts;
        scoreEl.innerText = String(score).padStart(5, '0');
        lengthEl.innerText = String(snake.length).padStart(2, '0');
        
        addExplosion(f.x, f.y, f.type === 'golden' ? '#ffd166' : '#00f5d4');
        sound(f.type === 'golden' ? 'bonus' : 'eat');

        foods.splice(eatenIdx, 1);

        // Spawn a replacement food
        let valid = false, fx, fy;
        while (!valid) {
          fx = Math.floor(Math.random() * COLS);
          fy = Math.floor(Math.random() * ROWS);
          valid = !snake.some(s => s.x === fx && s.y === fy) && !foods.some(food => food.x === fx && food.y === fy);
        }
        foods.push({
          x: fx,
          y: fy,
          type: Math.random() < 0.25 ? 'golden' : 'cyan',
          pulse: 0
        });

        // Speed increases slightly as snake grows
        speed = Math.max(50, 90 - Math.floor(snake.length / 5) * 4);
      } else {
        snake.pop();
      }
    }

    function render() {
      // Clear canvas
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle Grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      // Draw Food Pellets
      foods.forEach(f => {
        f.pulse += 0.08;
        const scale = 1 + Math.sin(f.pulse) * 0.15;
        const offset = (TILE_SIZE * (1 - scale)) / 2;
        ctx.save();
        ctx.fillStyle = f.type === 'golden' ? '#ffd166' : '#00f5d4';
        ctx.shadowColor = f.type === 'golden' ? '#ffd166' : '#00f5d4';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(
          f.x * TILE_SIZE + 2 + offset,
          f.y * TILE_SIZE + 2 + offset,
          (TILE_SIZE - 4) * scale,
          (TILE_SIZE - 4) * scale,
          5
        );
        ctx.fill();
        ctx.restore();
      });

      // Draw Snake with Gradient Colors
      snake.forEach((seg, i) => {
        ctx.save();
        if (i === 0) {
          // Head
          ctx.fillStyle = '#00f5d4';
          ctx.shadowColor = '#00f5d4';
          ctx.shadowBlur = 14;
        } else {
          // Body gradient
          const hue = 160 + (i * 5) % 180;
          ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
        }
        ctx.beginPath();
        ctx.roundRect(
          seg.x * TILE_SIZE + 1.5,
          seg.y * TILE_SIZE + 1.5,
          TILE_SIZE - 3,
          TILE_SIZE - 3,
          6
        );
        ctx.fill();
        ctx.restore();
      });

      // Overlay Screens
      if (gameState === 'START') {
        ctx.save();
        ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f5d4';
        ctx.font = 'bold 32px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#00f5d4'; ctx.shadowBlur = 15;
        ctx.fillText('🕹️ CYBERSNAKE 2077', canvas.width/2, canvas.height/2 - 25);
        ctx.fillStyle = '#f8fafc';
        ctx.font = '16px Courier New';
        ctx.fillText('PRESS [SPACE] OR TAP SCREEN TO PLAY', canvas.width/2, canvas.height/2 + 25);
        ctx.restore();
      } else if (gameState === 'OVER') {
        ctx.save();
        ctx.fillStyle = 'rgba(3, 7, 18, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0080';
        ctx.font = 'bold 32px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0080'; ctx.shadowBlur = 20;
        ctx.fillText('OVERHEAT // GAME OVER', canvas.width/2, canvas.height/2 - 30);
        ctx.fillStyle = '#00f5d4';
        ctx.font = '18px Courier New';
        ctx.fillText(`SCORE: ${score}  |  MAX LENGTH: ${snake.length}`, canvas.width/2, canvas.height/2 + 15);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px Courier New';
        ctx.fillText('Press [SPACE] or Tap Screen to Reboot', canvas.width/2, canvas.height/2 + 55);
        ctx.restore();
      }
    }

    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      const dt = time - lastTime;
      lastTime = time;
      accumulator += dt;

      while (accumulator >= speed) {
        step();
        accumulator -= speed;
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      snake = [{x: 10, y: 12}, {x: 9, y: 12}, {x: 8, y: 12}];
      dir = {x: 1, y: 0};
      inputQueue = [];
      score = 0;
      speed = 90;
      scoreEl.innerText = '00000';
      lengthEl.innerText = '03';
      spawnFood();
      gameState = 'PLAYING';
    }

    function queueDir(newDir) {
      const current = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
      // Prevent 180-degree immediate reversal
      if (newDir.x !== -current.x || newDir.y !== -current.y) {
        if (inputQueue.length < 3) inputQueue.push(newDir);
      }
    }

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (['Space'].includes(e.code)) {
        if (gameState !== 'PLAYING') startGame();
        e.preventDefault();
        return;
      }
      if (gameState === 'PLAYING') {
        if (['ArrowUp', 'KeyW'].includes(e.code)) { queueDir({x: 0, y: -1}); e.preventDefault(); }
        if (['ArrowDown', 'KeyS'].includes(e.code)) { queueDir({x: 0, y: 1}); e.preventDefault(); }
        if (['ArrowLeft', 'KeyA'].includes(e.code)) { queueDir({x: -1, y: 0}); e.preventDefault(); }
        if (['ArrowRight', 'KeyD'].includes(e.code)) { queueDir({x: 1, y: 0}); e.preventDefault(); }
      }
    });

    // Touch D-Pad handlers
    document.getElementById('dpad-up').onclick = () => queueDir({x: 0, y: -1});
    document.getElementById('dpad-down').onclick = () => queueDir({x: 0, y: 1});
    document.getElementById('dpad-left').onclick = () => queueDir({x: -1, y: 0});
    document.getElementById('dpad-right').onclick = () => queueDir({x: 1, y: 0});

    // Canvas Tap & Swipe
    canvas.addEventListener('click', () => {
      if (gameState !== 'PLAYING') startGame();
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      if (gameState !== 'PLAYING') startGame();
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) queueDir({x: 1, y: 0});
        else if (dx < -30) queueDir({x: -1, y: 0});
      } else {
        if (dy > 30) queueDir({x: 0, y: 1});
        else if (dy < -30) queueDir({x: 0, y: -1});
      }
    }, {passive: true});

    spawnFood();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
